<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Island Kod Sistemi</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }

  .box {
    background: #111827;
    padding: 25px;
    border-radius: 10px;
    width: 360px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  h2, h3 {
    text-align: center;
    color: #38bdf8;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 6px;
    border: none;
    outline: none;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    border: none;
    border-radius: 6px;
    background: #38bdf8;
    color: #000;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #0ea5e9;
  }

  p {
    text-align: center;
    margin-top: 10px;
  }

  #adminPanel {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #334155;
  }
</style>
</head>

<body>

<div class="box">
  <h2>Kod Gir</h2>
  <input id="codeInput" placeholder="Kodu gir">
  <button onclick="checkCode()">Onayla</button>
  <p id="result"></p>

  <div id="adminPanel" style="display:none;">
    <h3>ADMİN PANELİ</h3>
    <input id="newCode" placeholder="Yeni kod">
    <input id="newReward" placeholder="Ödül">
    <button onclick="addCode()">Kodu Kaydet</button>
    <p id="adminResult"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCj3-uqcyEZpajpaRmJKmS-xQmz28rUJqA",
  authDomain: "island-1e045.firebaseapp.com",
  projectId: "island-1e045",
  storageBucket: "island-1e045.firebasestorage.app",
  messagingSenderId: "386635095239",
  appId: "1:386635095239:web:6c036e4163e645b95bf2e2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function checkCode() {
  const code = document.getElementById("codeInput").value.trim();
  const result = document.getElementById("result");

  if (code === "9119") {
    document.getElementById("adminPanel").style.display = "block";
    result.innerText = "Admin paneli açıldı";
    return;
  }

  const ref = db.collection("kodlar").doc(code);
  const snap = await ref.get();

  if (!snap.exists) {
    result.innerText = "Kod yanlış";
    return;
  }

  const data = snap.data();

  if (data.kullanılmış) {
    result.innerText = "Kod kullanılmış";
    return;
  }

  result.innerText = "Ödül: " + data.ödül;
  await ref.update({ kullanılmış: true });
}

async function addCode() {
  const code = document.getElementById("newCode").value.trim();
  const reward = document.getElementById("newReward").value.trim();
  const adminResult = document.getElementById("adminResult");

  if (!code || !reward) {
    adminResult.innerText = "Kod ve ödül gir";
    return;
  }

  await db.collection("kodlar").doc(code).set({
    ödül: reward,
    kullanılmış: false
  });

  adminResult.innerText = "Kod eklendi";
}
</script>

</body>
</html>
